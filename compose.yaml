services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # gitignored artifacts produced by the pipeline (see Dockerfile note)
      - ./models:/app/models
      - ./data/processed:/app/data/processed
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s   # model/parquet load takes ~30s

  web:
    build:
      context: ./web
      args:
        # Next.js rewrites are resolved at build time, not runtime
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

# One command (after the pipeline has produced models/ and data/processed/):
#   docker compose up --build
# Dashboard: http://localhost:3000 — API docs: http://localhost:8000/docs
